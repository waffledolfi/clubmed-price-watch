name: Refresh Kiroro prices

on:
  schedule:
    # 23:23 UTC = 07:23 Singapore next day, every other day
    - cron: "23 23 */2 * *"
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the watched weeks
        run: python3 watch.py check

      - name: Scan the season
        run: python3 watch.py scan KIPC_WINTER 2026-12-01 2027-04-27 4,5,6 7

      - name: Rebuild the page
        run: python3 publish.py

      - name: Commit and push
        run: |
          git config user.name  "kiroro-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "Refresh prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
